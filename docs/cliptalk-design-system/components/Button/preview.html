<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Button — pratinjau</title></head>
<body>
<div id="root" class="ct-pad"></div>
<script>
  var K = window.ClipTalk, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment,null,
 h(K.Button,{variant:'primary',iconRight:null},'Buat klip'),
 h(K.Button,{variant:'secondary'},'Kembali'),
 h(K.Button,{variant:'outline',icon:'download'},'Unduh SRT'),
 h(K.Button,{variant:'ghost',icon:'back'},'Kembali'),
 h(K.Button,{variant:'destructive',size:'sm'},'Hapus'),
 h(K.Button,{variant:'primary',disabled:true},'Memproses…')));
</script>
</body>
</html>
