<!-- @dsCard height=288 -->
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>ClipTalk</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--background); color:var(--foreground); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; }
  .ink { fill:var(--foreground); }
  .range { fill:var(--range); }
  .soft { fill:var(--range-soft); }
  .muted { fill:var(--muted); }
  .cut { fill:var(--background); }
  .handle { fill:var(--range-ink); }
  .head { fill:var(--foreground); }
  .lg { rx:var(--radius-lg); }
  .bar { rx:var(--radius-xs); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:88px; line-height:.92; font-weight:600; letter-spacing:-.04em; color:var(--foreground); }
  .tag { margin:var(--space-3) 0 0 4px; font-size:14px; line-height:20px; color:var(--muted-foreground); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      foreground 192x176 bled off the top (the ledger, the biggest field: the system is achromatic) · range 264x120 bled off top and right (the one brand hue) · muted 120x136 · range-soft 128x136 bled right — about 40% of 960x288
  arrangement one tall ink slab on the left, the yellow range slab above two smaller blocks on the right, gutters space-4, bottoms on one line space-6 above the edge
  pattern     transcript lines + in/out handles, from "a quiet editor desk where yellow only means the clip range": 6px bars at a space-4 pitch cut out of the ink like transcript rows, and two range-ink handles with a foreground playhead on the yellow slab
  scales      gutters space-4; pitch space-4; bar height 6 with radius-xs; blocks radius-lg; handles 4 wide
-->
<rect class="ink lg" x="24" y="-16" width="192" height="280" rx="10"/>
<rect class="cut bar" x="40" y="24" width="56" height="6" rx="2"/>
<rect class="cut bar" x="104" y="24" width="88" height="6" rx="2"/>
<rect class="cut bar" x="200" y="24" width="40" height="6" rx="2"/>
<rect class="cut bar" x="40" y="40" width="120" height="6" rx="2"/>
<rect class="cut bar" x="168" y="40" width="32" height="6" rx="2"/>
<rect class="cut bar" x="40" y="56" width="72" height="6" rx="2"/>
<rect class="cut bar" x="120" y="56" width="64" height="6" rx="2"/>
<rect class="cut bar" x="192" y="56" width="24" height="6" rx="2"/>
<rect class="cut bar" x="40" y="72" width="96" height="6" rx="2"/>
<rect class="cut bar" x="144" y="72" width="48" height="6" rx="2"/>
<rect class="cut bar" x="40" y="88" width="40" height="6" rx="2"/>
<rect class="cut bar" x="88" y="88" width="104" height="6" rx="2"/>
<rect class="cut bar" x="40" y="104" width="64" height="6" rx="2"/>
<rect class="cut bar" x="112" y="104" width="40" height="6" rx="2"/>
<rect class="cut bar" x="160" y="104" width="48" height="6" rx="2"/>
<rect class="cut bar" x="40" y="120" width="112" height="6" rx="2"/>
<rect class="range lg" x="232" y="-16" width="264" height="128" rx="10"/>
<rect class="handle" x="264" y="24" width="4" height="64" rx="1"/>
<rect class="handle" x="424" y="24" width="4" height="64" rx="1"/>
<rect class="head" x="328" y="8" width="2" height="96"/>
<rect class="muted lg" x="232" y="128" width="120" height="136" rx="10"/>
<rect class="soft lg" x="368" y="128" width="128" height="136" rx="10"/>
<rect class="handle bar" x="384" y="232" width="80" height="6" rx="2"/>
</svg>
</div>
<div class="words">
<h1 class="name">ClipTalk</h1>
<p class="tag">Klip pendek dari podcast panjang, tanpa menonton ulang semuanya.</p>
</div>
</div>
</body>
</html>
