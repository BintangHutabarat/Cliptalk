<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Badge — pratinjau</title></head>
<body>
<div id="root" class="ct-pad"></div>
<script>
  var K = window.ClipTalk, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment,null,
 h(K.Badge,{tone:'range',mono:true},'Skor 98'),
 h(K.Badge,{tone:'outline',mono:true},'Skor 85'),
 h(K.Badge,{tone:'success',icon:'check'},'Klip siap'),
 h(K.Badge,{tone:'warning'},'Transkrip kurang yakin'),
 h(K.Badge,{tone:'destructive'},'Gagal render'),
 h(K.Badge,null,'Bahasa Indonesia')));
</script>
</body>
</html>
